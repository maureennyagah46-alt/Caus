<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CABS Bank Zimbabwe — Loan</title>
  <style>
    :root {
      --eco-blue: #173b78;
      --eco-blue-dark: #102b5b;
      --eco-red: #55a747;
      --navy: #173b78;
      --green: #238b45;
      --green-accent: #55a747;
      --ink: #1f2430;
      --muted: #6b7280;
      --muted-light: #9ca3af;
      --surface: #ffffff;
      --app-bg: #f1f2f6;
      --card-bg: #ffffff;
      --feature-bg: #eef3f8;
      --border: #e3e6ef;
      --radius: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    img, svg { max-width: 100%; }

    .demo-notice {
      background: #fff5d8;
      color: #684d00;
      text-align: center;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
    }

    .logo {
      font-weight: 800;
      font-size: 26px;
      color: var(--eco-blue);
      letter-spacing: -0.5px;
    }

    .logo span { color: var(--eco-red); }

    .logo-img {
      height: 40px;
      width: auto;
      flex: 0 0 auto;
      display: block;
      object-fit: contain;
    }

    .app-body {
      background: var(--app-bg);
      padding: clamp(14px, 4vw, 24px) 16px;
    }

    .app-shell {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 14px;
      padding: clamp(18px, 5vw, 24px) clamp(16px, 5vw, 26px) clamp(24px, 6vw, 34px);
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--eco-blue);
    }

    .brand small {
      display: block;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--green);
      font-weight: 800;
    }

    .header-user {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-welcome {
      font-weight: 700;
      font-size: 17px;
      margin-top: 2px;
    }

    .header-rule {
      height: 3px;
      background: var(--green);
      border-radius: 3px;
      margin: 14px 0 0;
    }

    .hero {
      text-align: center;
      margin: 26px 0 24px;
    }

    .hero-title {
      font-size: clamp(20px, 6vw, 24px);
      font-weight: 800;
      color: var(--green);
      margin: 0 0 8px;
    }

    .hero-title span { color: var(--eco-blue); }

    .hero-sub {
      color: var(--green-accent);
      font-size: 15px;
      margin: 0;
    }

    .loan-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
      align-items: start;
    }

    .calc-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(18px, 5vw, 26px);
      box-shadow: 0 2px 10px rgba(20,27,77,.05);
    }

    .calc-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0 0 12px;
    }

    .calc-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0 0 22px;
    }

    .calc-label {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .5px;
      margin: 0 0 6px;
    }

    .calc-label--center { margin-top: 26px; }

    .calc-amount {
      text-align: center;
      font-size: clamp(28px, 8vw, 34px);
      font-weight: 800;
      margin: 0 0 16px;
    }

    .amount-input-wrap { margin-bottom: 18px; }

    .amount-input-label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .amount-input {
      width: 100%;
      border: 1px solid #cdd1dc;
      border-radius: 10px;
      padding: 13px 14px;
      font: inherit;
      font-size: 16px;
      color: var(--ink);
      outline: none;
    }

    .amount-input:focus { border-color: var(--eco-blue); }

    .slider {
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 6px;
      background: var(--navy);
      outline: none;
    }

    .slider::-webkit-slider-thumb {
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #c9ccd6;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }

    .slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #c9ccd6;
      cursor: pointer;
    }

    .slider-ends {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }

    .calc-term {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 16px;
    }

    .term-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .term-btn {
      background: #f3f4f8;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #3a3f4b;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .term-btn.is-active {
      background: var(--green-accent);
      color: #fff;
      border-color: var(--green-accent);
    }

    .payment-box {
      background: var(--feature-bg);
      border-radius: var(--radius);
      text-align: center;
      padding: 18px;
      margin: 24px 0 20px;
    }

    .payment-label {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .5px;
      margin: 0 0 6px;
    }

    .payment-amount {
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 6px;
    }

    .payment-rate {
      color: var(--muted);
      font-size: 13px;
      margin: 0;
    }

    .btn-apply {
      width: 100%;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 18px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .5px;
      cursor: pointer;
    }

    .btn-apply:hover { background: #102b5b; }

    .disclaimer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      margin: 18px 0 0;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%) translateY(20px);
      background: var(--navy);
      color: #fff;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      z-index: 50;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 360px) {
      .term-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body class="app-body">

  <div class="loan-notice">
  </div>

  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        CABS
        <small>LOAN CALCULATOR</small>
      </div>

      <div class="header-user">
        <span aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28"
            fill="none" stroke="#173b78" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21a8 8 0 0 1 16 0"></path>
          </svg>
        </span>
        <span class="header-welcome">Welcome</span>
      </div>
    </header>

    <div class="header-rule"></div>

    <section class="hero">
      <h1 class="hero-title">Explore Your Loan <span>Options</span></h1>
      <p class="hero-sub">Illustrative repayments • Flexible terms</p>
    </section>

    <div class="loan-layout">
      <section class="calc-card">
        <h2 class="calc-title">Loan Calculator</h2>
        <hr class="calc-divider" />

        <p class="calc-label">LOAN AMOUNT</p>
        <p class="calc-amount" id="loan-amount">$500</p>

        <div class="amount-input-wrap">
          <label class="amount-input-label" for="amount-input">
            Enter amount (USD 50–50,000)
          </label>

          <input
            type="number"
            id="amount-input"
            class="amount-input"
            min="50"
            max="50000"
            step="1"
            value="500"
            inputmode="numeric"
          />
        </div>

        <input
          type="range"
          id="amount-slider"
          class="slider"
          min="50"
          max="50000"
          step="1"
          value="500"
          aria-label="Loan amount"
        />

        <div class="slider-ends">
          <span>USD 50</span>
          <span>USD 50,000</span>
        </div>

        <p class="calc-label calc-label--center">LOAN TERM</p>
        <p class="calc-term" id="term-display">12 months</p>

        <div class="term-grid" id="term-grid">
          <button type="button" class="term-btn" data-term="6">6 months</button>
          <button type="button" class="term-btn is-active" data-term="12">12 months</button>
          <button type="button" class="term-btn" data-term="24">24 months</button>
          <button type="button" class="term-btn" data-term="36">36 months</button>
          <button type="button" class="term-btn" data-term="48">48 months</button>
          <button type="button" class="term-btn" data-term="60">60 months</button>
        </div>

        <div class="payment-box">
          <p class="payment-label">MONTHLY PAYMENT</p>
          <p class="payment-amount" id="monthly-payment">$42.69</p>
          <p class="payment-rate">Calculation using 4.5% APR</p>
        </div>

        <button type="button" class="btn-apply" id="apply-now">
          APPLY NOW
        </button>

        <p class="disclaimer">
          © Copyright 2026 CABS. A Member of the Old Mutual Group
        </p>
      </section>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      var slider = document.getElementById("amount-slider");
      var amountEl = document.getElementById("loan-amount");
      var amountInput = document.getElementById("amount-input");
      var termDisplay = document.getElementById("term-display");
      var monthlyEl = document.getElementById("monthly-payment");
      var termGrid = document.getElementById("term-grid");
      var applyBtn = document.getElementById("apply-now");

      var MIN_AMOUNT = 50;
      var MAX_AMOUNT = 50000;
      var ANNUAL_RATE = 0.045;

      var state = {
        amount: Number(slider.value),
        term: 12
      };

      function fmt(n) {
        return "$" + n.toLocaleString("en-US", {
          maximumFractionDigits: 0
        });
      }

      function monthlyPayment(principal, months) {
        var r = ANNUAL_RATE / 12;
        if (r === 0) return principal / months;
        return principal * r / (1 - Math.pow(1 + r, -months));
      }

      function render(syncAmountInput) {
        amountEl.textContent = fmt(state.amount);

        if (syncAmountInput) {
          amountInput.value = String(state.amount);
        }

        termDisplay.textContent = state.term + " months";

        var payment = monthlyPayment(state.amount, state.term);

        monthlyEl.textContent = "$" + payment.toLocaleString("en-US", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      }

      slider.addEventListener("input", function () {
        state.amount = Number(slider.value);
        render(true);
      });

      amountInput.addEventListener("input", function () {
        var amount = Number(amountInput.value);

        if (
          amountInput.value === "" ||
          !Number.isFinite(amount) ||
          amount < MIN_AMOUNT ||
          amount > MAX_AMOUNT
        ) {
          return;
        }

        state.amount = Math.round(amount);
        slider.value = String(state.amount);
        render(false);
      });

      amountInput.addEventListener("change", function () {
        var amount = Number(amountInput.value);

        if (amountInput.value === "" || !Number.isFinite(amount)) {
          amount = MIN_AMOUNT;
        }

        state.amount = Math.min(
          MAX_AMOUNT,
          Math.max(MIN_AMOUNT, Math.round(amount))
        );

        slider.value = String(state.amount);
        render(true);
      });

      termGrid.addEventListener("click", function (event) {
        var btn = event.target.closest(".term-btn");
        if (!btn) return;

        termGrid.querySelectorAll(".term-btn").forEach(function (button) {
          button.classList.remove("is-active");
        });

        btn.classList.add("is-active");
        state.term = Number(btn.dataset.term);
        render(false);
      });

      applyBtn.addEventListener("click", function () {
        var params = new URLSearchParams({
          demo_amount: String(state.amount),
          demo_term: String(state.term)
        });

        window.location.href = "details.html?" + params.toString();
      });

      render(true);
    })();
  </script>
</body>
</html>
