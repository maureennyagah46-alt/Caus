
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>CABS Bank Zimbabwe – Loan Application</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #e5e5e5;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --sub: #6b7280;
      --cabs-blue: #173b78;
      --cabs-green: #55a747;
      --blue-dark: #102b5b;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --radius: 18px;
    }

    body {
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: #f7f7f7;
      border-radius: 28px;
      padding: 20px 16px 24px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .demo-notice {
      background: #fff5d8;
      color: #684d00;
      padding: 9px;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.5;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .top-accent {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(
        90deg,
        var(--cabs-blue) 0%,
        var(--cabs-green) 100%
      );
      z-index: 1;
    }

    .cabs-header {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 12px;
    }

    .logo-circle {
      width: 58px;
      height: 58px;
      background: var(--cabs-blue);
      border-radius: 12px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -2px;
      margin: 0 auto 7px;
      box-shadow: 0 4px 10px rgba(23, 59, 120, 0.3);
      border-bottom: 4px solid var(--cabs-green);
    }

    .logo-text {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 4px;
      color: var(--cabs-blue);
    }

    .logo-subtitle {
      font-size: 10px;
      font-weight: 800;
      color: var(--cabs-green);
      letter-spacing: 2px;
    }

    .application-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      text-align: center;
      margin: 12px 0 20px;
      position: relative;
      z-index: 2;
      transition: all 0.3s ease;
    }

    .step-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .step-icon {
      font-size: 40px;
      color: var(--cabs-blue);
      margin-bottom: 4px;
    }

    .step-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--cabs-blue);
      margin-bottom: 8px;
    }

    .step-description {
      font-size: 14px;
      color: var(--sub);
      line-height: 1.5;
    }

    .loader {
      width: 36px;
      height: 36px;
      border: 3px solid #e5f0e4;
      border-top: 3px solid var(--cabs-green);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 16px auto 0;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .limit-badge {
      background: #eef5ec;
      border: 1px solid #cfe2c9;
      border-radius: 40px;
      padding: 6px 14px;
      display: inline-block;
      font-weight: 600;
      font-size: 14px;
      color: var(--cabs-blue);
      margin: 12px 0;
    }

    .loan-form {
      width: 100%;
      margin: 12px 0;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--sub);
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      outline: none;
      transition: border 0.2s;
      background: #fff;
    }

    .input-group input:focus {
      border-color: var(--cabs-green);
      box-shadow: 0 0 0 2px rgba(85, 167, 71, 0.1);
    }

    .name-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .error-message {
      font-size: 11px;
      color: #d12b2b;
      margin-top: 4px;
      display: none;
    }

    .btn {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, var(--cabs-blue), var(--blue-dark));
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(23, 59, 120, 0.25);
      transition: 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn:hover {
      background: linear-gradient(90deg, var(--blue-dark), #0a2448);
      transform: scale(1.01);
    }

    .btn:disabled {
      background: #e5e5e5;
      color: #999;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .section-header {
      text-align: left;
      margin: 16px 0 10px;
      padding-bottom: 6px;
      border-bottom: 2px solid #e4efdf;
    }

    .section-header h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--cabs-blue);
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-header h3 i {
      font-size: 16px;
      color: var(--cabs-green);
    }

    .footer {
      text-align: center;
      margin-top: 16px;
      font-size: 11px;
      color: #888;
      position: relative;
      z-index: 2;
      line-height: 1.6;
    }

    #spinner {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(2px);
      z-index: 999;
    }

    .spinner-loader {
      width: 44px;
      height: 44px;
      border: 4px solid #e5f0e4;
      border-top: 4px solid var(--cabs-green);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @media (max-width: 380px) {
      .container {
        padding: 16px 12px 20px;
      }

      .application-card {
        padding: 16px 12px;
      }

      .step-icon {
        font-size: 36px;
      }

      .step-title {
        font-size: 18px;
      }

      .step-description {
        font-size: 13px;
      }

      .limit-badge {
        font-size: 13px;
        padding: 5px 12px;
      }

      .input-group input {
        padding: 10px 12px;
        font-size: 14px;
      }

      .btn {
        padding: 12px;
        font-size: 15px;
      }

      .name-row {
        gap: 8px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="top-accent"></div>

    <div class="loan-notice">
      CENTRAL AFRICA BUILDING SOCIETY LOAN
    </div>

    <div class="cabs-header">

      <div class="logo-circle">CABS</div>

      <div class="logo-text">CABS BANK</div>

      <div class="logo-subtitle">ZIMBABWE</div>

    </div>

    <div class="application-card" id="applicationCard">
      <div id="stepContent"></div>
    </div>

    <div class="footer">
         © Copyright 2026 CABS.<br>
    A Member of the Old Mutual Group
    </div>

  </div>

  <div id="spinner">
    <div class="spinner-loader"></div>
  </div>

  <script>
    "use strict";

    const steps = [
      {
        icon: "fas fa-user-check",
        title: "Eligibility",
        description: "Demonstrating how an eligibility review interface works...",
        duration: 2000
      },
      {
        icon: "fas fa-chart-line",
        title: "Loan Limit Example",
        description: "Preparing illustrative loan calculation information...",
        duration: 2000
      },
      {
        icon: "fas fa-file-invoice-dollar",
        title: "Preparing Offer",
        description: "Your demonstration loan form is almost ready...",
        duration: 2000
      }
    ];

    let currentStep = 0;
    let timeoutId = null;

    const stepContent = document.getElementById("stepContent");

    const MAX_LIMIT = 50000;
    const MIN_AMOUNT = 50;

    const DEMO_PHONE_KEY = "cabs_demo_phone";

    function normalizeZimPhone(phoneRaw) {
      let digits = phoneRaw.replace(/\D/g, "");

      if (digits.startsWith("263")) {
        digits = digits.substring(3);
      }

      if (digits.startsWith("0") && digits.length === 10) {
        digits = digits.substring(1);
      }

      if (digits.length === 9 && digits.startsWith("7")) {
        return digits;
      }

      return null;
    }

    function renderStep(index) {
      const step = steps[index];

      stepContent.innerHTML = `
        <div class="step-container">
          <div class="step-icon">
            <i class="${step.icon}"></i>
          </div>

          <div class="step-title">${step.title}</div>

          <div class="step-description">
            ${step.description}
          </div>

          <div class="loader"></div>
        </div>
      `;
    }

    function showLoanForm() {
      stepContent.innerHTML = `
        <div class="step-container">

          <div class="step-icon">
            <i class="fas fa-check-circle"></i>
          </div>

          <div class="step-title">
            Demo Form Ready
          </div>

          <div class="limit-badge">
            Illustrative Maximum: $${MAX_LIMIT.toLocaleString()}
          </div>

          <div class="step-description">
            This is a demonstration form. No eligibility decision or
            loan approval is provided.
          </div>

          <div class="loan-form">

            <div class="input-group">
              <label for="loanAmount">Example Loan Amount (USD)</label>

              <input
                type="number"
                id="loanAmount"
                placeholder="Enter amount"
                min="${MIN_AMOUNT}"
                max="${MAX_LIMIT}"
                step="1"
              >

              <div class="error-message" id="amountError">
                Enter a valid amount.
              </div>
            </div>

            <div class="section-header">
              <h3>
                <i class="fas fa-user-friends"></i>
                Guarantor / Next of Kin Details
              </h3>
            </div>

            <div class="name-row">

              <div class="input-group" style="margin-bottom:0">
                <label for="guarantorFirstName">First Name</label>
                <input
                  type="text"
                  id="guarantorFirstName"
                  placeholder="First name"
                  autocomplete="off"
                >
              </div>

              <div class="input-group" style="margin-bottom:0">
                <label for="guarantorLastName">Last Name</label>
                <input
                  type="text"
                  id="guarantorLastName"
                  placeholder="Last name"
                  autocomplete="off"
                >
              </div>

            </div>

            <div class="input-group">
              <label for="guarantorPhone">
                Example Phone Number
              </label>

              <input
                type="tel"
                id="guarantorPhone"
                placeholder="0771234567"
                inputmode="numeric"
                maxlength="13"
              >

              <div class="error-message" id="phoneError">
                Enter a valid example phone number.
              </div>
            </div>

            <div class="error-message" id="nameError">
              Enter both first and last names.
            </div>

            <button id="applyBtn" class="btn" disabled>
              CONTINUE
            </button>

          </div>

        </div>
      `;

      const amountInput = document.getElementById("loanAmount");
      const firstNameInput = document.getElementById("guarantorFirstName");
      const lastNameInput = document.getElementById("guarantorLastName");
      const phoneInput = document.getElementById("guarantorPhone");

      const applyBtn = document.getElementById("applyBtn");

      const amountError = document.getElementById("amountError");
      const phoneError = document.getElementById("phoneError");
      const nameError = document.getElementById("nameError");

      function validate(showErrors = false) {
        const amount = Number(amountInput.value);

        const firstName = firstNameInput.value.trim();
        const lastName = lastNameInput.value.trim();

        const phone = phoneInput.value.trim();

        const normalizedPhone = normalizeZimPhone(phone);

        const validAmount =
          Number.isFinite(amount) &&
          amount >= MIN_AMOUNT &&
          amount <= MAX_LIMIT;

        const validPhone = Boolean(normalizedPhone);

        const validNames =
          firstName.length > 0 &&
          lastName.length > 0;

        amountError.style.display =
          showErrors && !validAmount ? "block" : "none";

        phoneError.style.display =
          showErrors && !validPhone ? "block" : "none";

        nameError.style.display =
          showErrors && !validNames ? "block" : "none";

        return validAmount && validPhone && validNames;
      }

      function updateButtonState() {
        applyBtn.disabled = !validate(false);
      }

      [
        amountInput,
        firstNameInput,
        lastNameInput,
        phoneInput
      ].forEach(field => {
        field.addEventListener("input", updateButtonState);
        field.addEventListener("blur", () => validate(true));
      });

      applyBtn.addEventListener("click", function () {
        if (!validate(true)) return;

        const demoData = {
          amount: Number(amountInput.value),
          firstName: firstNameInput.value.trim(),
          lastName: lastNameInput.value.trim(),
          phone: normalizeZimPhone(phoneInput.value.trim())
        };

        // Demo-only processing. No banking credentials or PINs collected.
        const spinner = document.getElementById("spinner");

        spinner.style.display = "flex";
        applyBtn.disabled = true;

        setTimeout(() => {
          spinner.style.display = "none";

          stepContent.innerHTML = `
            <div class="step-container">

              <div class="step-icon">
                <i class="fas fa-check-circle"></i>
              </div>

              <div class="step-title">
                Demo Completed
              </div>

              <div class="step-description">
                Your loan form passed the local validation checks.
                Wait while we review your details.
              </div>

              <div class="limit-badge">
                Example Amount: $${demoData.amount.toLocaleString()}
              </div>

              <button class="btn" id="restartBtn">
                RESTART APPLICATION
              </button>

            </div>
          `;

          document.getElementById("restartBtn")
            .addEventListener("click", () => {
              currentStep = 0;
              startApplication();
            });

        }, 1200);
      });

      updateButtonState();
    }

    function nextStep() {
      currentStep++;

      if (currentStep < steps.length) {
        renderStep(currentStep);

        timeoutId = setTimeout(
          nextStep,
          steps[currentStep].duration
        );
      } else {
        showLoanForm();
      }
    }

    function startApplication() {
      if (timeoutId) clearTimeout(timeoutId);

      renderStep(0);

      timeoutId = setTimeout(
        nextStep,
        steps[0].duration
      );
    }

    startApplication();

    window.addEventListener("beforeunload", () => {
      if (timeoutId) clearTimeout(timeoutId);
    });

  </script>

</body>
</html>
